version: 1.30.2-{build}-{branch}

skip_branch_with_pr: true

clone_depth: 5

platform:
  - x64

cache:

- C:\Users\appveyor\.ant -> appveyor.yml
- C:\Users\appveyor\.ivy2 -> appveyor.yml
- C:\tools\php83 -> appveyor.yml
- C:\ProgramData\chocolatey\bin -> appveyor.yml
- C:\ProgramData\chocolatey\lib -> appveyor.yml
- C:\Program Files\Java\jdk11\bin -> appveyor.yml

init:

#- cmd: gem update --system
#- ps: cinst ant 2>&1 | Out-Null  ## used to work
- ps: choco install ant --ignore-dependencies --no-progress 

# install some dependencies needed by php
- ps: choco install chocolatey-core.extension --ignore-dependencies --no-progress 

# install php 8.3 to match C:\tools\php83 on PATH and in the cache (dependencies kb2919442 kb3035131 kb2999226 were failing)
- ps: choco install php --version 8.3.13 --ignore-dependencies --limitoutput --no-progress 

# install the latest cmake
- ps: choco install cmake --no-progress --installargs 'ADD_CMAKE_TO_PATH=System' --apply-install-arguments-to-dependencies

# install the latest gcc and g++
- ps: choco install mingw --limitoutput --no-progress

install:
# NOTE if changing php version, make sure you change the cache above
# Umple generates Python 3, but AppVeyor images put Python 2.7 first on PATH
- ps: $env:Path="C:\Python38-x64;C:\Python38-x64\Scripts;C:\Ruby23\bin;C:\Program Files\Java\jdk11\bin;$($env:Path);C:\tools\php83;C:\tools\php;C:\tools\MinGW;C:\ProgramData\mingw64\mingw64\bin;C:\ProgramData\chocolatey\lib\ant;C:\Program Files\CMake;C:\Program Files\CMake\bin"

- ps: $env:JAVA_HOME="C:\Program Files\Java\jdk11" 

# Python 3 checks and runs generated Python; the compiler and the testbed use the interpreter named here
- ps: $env:UMPLE_PYTHON="C:\Python38-x64\python.exe"
- ps: $env:UMPLE_REQUIRE_PYTHON="1"
- ps: '& $env:UMPLE_PYTHON --version'
- ps: echo "Path is $env:Path"
- cmd: python -c "import sys; print(sys.version); sys.exit(sys.version_info < (3, 8))"

- ps: echo "Java versions available"
- ps: dir "C:\Program Files\Java"

- ps: ant -version

- ps: echo "gcc version"
- ps: gcc --version

- ps: echo "cmake version"
- ps: cmake --version

- ps: pushd build

- cmd: ant bootstrap
- cmd: ant deps-resolve-all

- ps: popd

- cmd: php --version
- cmd: ruby -v
- cmd: java -version # using ps causes it to fail because it prints to sterr
- cmd: ant -version
- cmd: rake -V

build_script:

- ps: cd build

- cmd: ant first-build
- cmd: ant -f build.umple.xml -Dfirst.build=false -Dmyenv=appveyor

test_script:

- cmd: ant -f build.testbed.xml -Dfirst.build=false -Dmyenv=appveyor
- cmd: ant -f build.exampletests.xml allUserManualAndExampleTests -Dmyenv=appveyor

artifacts:

# built compiler
- path: dist\umple.jar

# html test results
- path: dist\qa
